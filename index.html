<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그날 본 7번 문제의 정답을 우리는 아직 모른다</title>
<style>
:root{--bg1:#0b1230;--bg2:#2a2f63;--ink:#eef0ff;--sub:#a9b0dd;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.28);--acc:#8fd3ff;--acc-ink:#07122b;--pink:#ffb3d1;--err:#ff9a8f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#cfe3ff;--bg2:#f6dff0;--ink:#1c2250;--sub:#4b5390;--card:rgba(255,255,255,.65);--line:rgba(28,34,80,.3);--acc:#1f5fa8;--acc-ink:#fff;--pink:#c2457c;--err:#b3382c;color-scheme:light}}
:root[data-theme="light"]{--bg1:#cfe3ff;--bg2:#f6dff0;--ink:#1c2250;--sub:#4b5390;--card:rgba(255,255,255,.65);--line:rgba(28,34,80,.3);--acc:#1f5fa8;--acc-ink:#fff;--pink:#c2457c;--err:#b3382c;color-scheme:light}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Noto Serif KR","Noto Sans KR",serif;line-height:1.75;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.p{position:absolute;top:-8vh;color:var(--pink);opacity:.8;animation:fall linear infinite}
.f{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 4px #fff6a8aa;animation:glow ease-in-out infinite alternate}
@keyframes fall{to{transform:translate(60px,112vh) rotate(360deg)}}
@keyframes glow{from{opacity:.1;transform:translateY(0)}to{opacity:1;transform:translateY(-18px)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:26px 16px 56px}
h1{font-size:1.55rem;line-height:1.35;margin:0 0 6px;text-align:center;text-shadow:0 2px 12px #0006}
.kicker{text-align:center;color:var(--acc);letter-spacing:.4em;font-weight:700;margin-bottom:10px}
.flower{display:block;margin:0 auto 6px;width:84px;height:84px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px);white-space:pre-line}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-ink);font:700 1.05rem "Noto Sans KR",sans-serif;cursor:pointer}
.lock{display:flex;gap:8px;margin:14px 0}
.dot{flex:1;text-align:center;padding:6px 0;border:2px solid var(--line);border-radius:10px;font:800 1.1rem "Noto Sans KR",sans-serif;color:var(--sub);background:var(--card)}
.dot.cur{border-color:var(--acc);color:var(--acc)}
.dot.done{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
figure{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 24px #0005}
figure img{display:block;width:100%;height:auto}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.tag{font:900 2rem "Noto Sans KR",sans-serif;color:var(--acc)}
#digit{width:7rem;font-size:2.4rem;text-align:center;padding:10px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
#digit:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
#digit.bad{border-color:var(--err);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#msg{min-height:1.7em;text-align:center;margin-top:8px;font:700 1rem "Noto Sans KR",sans-serif}
#msg.err{color:var(--err)}#msg.ok{color:var(--acc)}
#hint{display:none;margin-top:10px;border-color:var(--acc);font-family:"Noto Sans KR",sans-serif;font-size:.95rem;line-height:1.6}
#hint.show{display:block}
#win{text-align:center;font:900 clamp(3.4rem,18vw,6.5rem) "Noto Sans KR",sans-serif;color:var(--acc);margin:18px 0 4px;text-shadow:0 0 24px var(--acc);animation:pop .5s ease-out}
#code{text-align:center;letter-spacing:.4em;color:var(--sub);font:700 1.2rem "Noto Sans KR",sans-serif}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.p,.f,#win,#digit.bad{animation:none}.f{opacity:.7}}
</style></head><body>
<div id="fx" aria-hidden="true"></div>
<main>
<svg class="flower" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="var(--acc)" opacity=".9"><ellipse rx="11" ry="20" cy="-20"/><ellipse rx="11" ry="20" cy="-20" transform="rotate(72)"/><ellipse rx="11" ry="20" cy="-20" transform="rotate(144)"/><ellipse rx="11" ry="20" cy="-20" transform="rotate(216)"/><ellipse rx="11" ry="20" cy="-20" transform="rotate(288)"/></g><circle r="7" fill="#ffe066"/></svg>
<div class="kicker">방탈출</div>
<h1>그날 본 7번 문제의 정답을 우리는 아직 모른다</h1>

<section id="intro">
<div class="box" id="introText"></div>
<button class="btn" id="start">비밀기지 문 앞으로</button>
</section>

<section id="game" hidden>
<div class="lock" id="lock"></div>
<div class="box" id="story"></div>
<figure><img id="pic" alt=""></figure>
<div class="cell"><span class="tag" id="tag"></span>
<input id="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="숫자 입력"></div>
<div id="msg" role="status" aria-live="polite"></div>
<div class="box" id="hint"></div>
</section>

<section id="end" hidden>
<div class="lock" id="lock2"></div>
<div id="win">탈출!</div>
<div id="code"></div>
<div class="box" id="endText" style="margin-top:16px"></div>
</section>
</main>

const INTRO='여름방학 마지막 날, 해 질 무렵.\n우리는 폐교 뒤 낡은 창고 앞에 다시 모였다. 어릴 적 네 명이 매일 모이던 ‘비밀기지’다.\n\n그날 칠판에 풀다 만 7번 문제를 남기고, 한 친구는 먼저 떠났다. 그 뒤로 이 문은 네 자리 자물쇠로 잠겨 있다.\n\n번호는 친구들이 남긴 네 장의 쪽지 속에 있다. 쪽지마다 문제 하나, 답은 한 자리 숫자.\n\n정답을 우리는 아직 모른다. 그래도 번호는 찾을 수 있다.';
const STORY=[
'첫 번째 쪽지 (F)\n문틈에 끼어 있던 낡은 종이. 어른인 척 어려운 식을 휘갈겨 쓴 건, 분명 제일 잘난 척하던 그 애의 글씨다.',
'두 번째 쪽지 (B)\n창가의 시든 꽃병 밑에서 나왔다. 짧고 단순한 식. 너무 쉬워서 오히려 그 애다운 장난 같다.',
'세 번째 쪽지 (C)\n그래프가 그려진 종이. 점들이 반딧불처럼 흩어져 있다. 하나하나 짚어서 읽어야 한다.',
'마지막 쪽지 (A)\n가장 오래돼서 글씨가 번졌다. 이걸 풀면 자물쇠가 열릴 것 같다.'];
const OK=['찰칵. 첫 번째 칸이 열렸다.','찰칵. 두 번째 칸이 열렸다. 어디선가 풀벌레 소리가 난다.','찰칵. 세 번째 칸. 문틈으로 바람이 스민다.','철컥—'];
const HINTS=[
'x→∞에서 √(x²+8x) − x는 ∞−∞ 꼴이에요. (√(x²+8x) + x)를 분자·분모에 곱해 분자를 유리화하고, 분자·분모를 x로 나눠 보세요.',
'x가 한없이 커지면 1/x는 어떤 값에 가까워질까요? 그 값에 6을 더해 보세요.',
'그래프에서 x=a의 좌극한(a−)은 왼쪽에서, 우극한(a+)은 오른쪽에서 다가갈 때의 높이예요. 빈 점(○)이어도 극한값은 있을 수 있고, 좌극한과 우극한이 다르면 극한은 존재하지 않아요. 항마다 따로 읽고 더하고 빼 보세요.',
'√(x²)는 |x|예요. x→3이면 x는 양수니까 √(x²)=x로 볼 수 있고, 식이 연속이면 3을 그대로 대입하면 돼요.'];
const END='철컥— 자물쇠가 열렸다.\n문틈으로 새벽빛이 쏟아진다. 칠판 구석에는 낡은 글씨 하나가 남아 있다. 7.\n\n그날 본 7번 문제의 정답을 우리는 아직 모른다. 그래도 우리가 함께 찾은 번호는 있다.';
const $=id=>document.getElementById(id), inp=$('digit'), msg=$('msg');
let step=0, lockBusy=false;
const fx=$('fx');
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='p';s.textContent='✿';s.style.cssText='left:'+Math.random()*100+'%;font-size:'+(12+Math.random()*14)+'px;animation-duration:'+(9+Math.random()*9)+'s;animation-delay:-'+Math.random()*14+'s';fx.appendChild(s)}
for(let i=0;i<16;i++){const s=document.createElement('span');s.className='f';s.style.cssText='left:'+Math.random()*100+'%;top:'+(40+Math.random()*55)+'%;animation-duration:'+(2+Math.random()*3)+'s;animation-delay:-'+Math.random()*4+'s';fx.appendChild(s)}
function lockHTML(){return TAGS.map((t,i)=>'<div class="dot '+(i<step?'done':i===step&&step<4?'cur':'')+'">'+(i<step?ANS[i]:t)+'</div>').join('')}
function render(){
  $('lock').innerHTML=lockHTML();
  if(step>=4){$('game').hidden=true;$('end').hidden=false;$('lock2').innerHTML=lockHTML();$('code').textContent=ANS.join(' ');$('endText').textContent=END;window.scrollTo(0,0);return}
  $('story').textContent=STORY[step];
  $('pic').src=IMGS[step];$('pic').alt='문항 유형 '+TAGS[step];$('tag').textContent=TAGS[step];
  inp.value='';msg.textContent='';msg.className='';$('hint').className='box';inp.classList.remove('bad');lockBusy=false;
}
$('introText').textContent=INTRO;
$('start').addEventListener('click',()=>{$('intro').hidden=true;$('game').hidden=false;render();inp.focus()});
inp.addEventListener('input',()=>{
  if(lockBusy)return;
  inp.value=inp.value.replace(/\D/g,'').slice(-1);
  if(!inp.value)return;
  if(inp.value===ANS[step]){
    lockBusy=true;msg.className='ok';msg.textContent=OK[step];$('hint').className='box';
    step++;$('lock').innerHTML=lockHTML();
    setTimeout(()=>{render();if(step<4)inp.focus()},1300);
  }else{
    msg.className='err';msg.textContent='자물쇠가 꿈쩍도 하지 않는다. 다시 입력해 보자.';
    $('hint').textContent='힌트\n'+HINTS[step];$('hint').className='box show';
    inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');setTimeout(()=>{inp.value=''},350);
  }
});
</script></body></html>
