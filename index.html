<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패링 러시</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffd23f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none}
canvas{width:100%;max-width:640px;background:#000;touch-action:none}
#pb{width:min(92%,420px);padding:16px;font:bold 22px "Courier New",monospace;background:#000;color:var(--gold);border:3px solid var(--gold);cursor:pointer;touch-action:manipulation}
#pb:active{background:var(--gold);color:#000}
#mt{background:#000;color:#fff;border:2px solid #666;font-size:18px;padding:4px 14px;cursor:pointer}
p{margin:0;font-size:13px;opacity:.7;text-align:center;padding:0 12px}
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<button id="pb">패링 (Space / Z)</button>
<button id="mt" title="효과음 (M)">🔊</button>
<p>이동: 방향키·WASD / 캔버스 드래그 · 증강 선택: 카드 터치 또는 1·2·3 · M: 효과음</p>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const BX=170,BY=230,BW=300,BH=200,CX=BX+BW/2,CY=BY-14;
const defA=()=>({R:32,win:.18,pw:.09,dmg:2,pdmg:6,wcd:.95,mhp:20,spd:190,cb:0,ih:1,heal:0});
const AUG=[
{n:'넓은 손',d:'패링 링 반경|+8',f:a=>a.R+=8},
{n:'긴 기도',d:'패링 지속시간|+0.05초',f:a=>a.win+=.05},
{n:'찰나의 눈',d:'완벽 패링 판정|+0.03초',f:a=>a.pw+=.03},
{n:'심판의 반사',d:'완벽 패링 피해|+20%',f:a=>a.pdmg*=1.2},
{n:'가벼운 후회',d:'헛손질 쿨다운|-0.3초',f:a=>a.wcd=Math.max(.5,a.wcd-.3)},
{n:'강철 신앙',d:'최대 HP +4|HP 4 회복',f:(a,s)=>{a.mhp+=4;s.hp=Math.min(a.mhp,s.hp+4)}},
{n:'가벼운 발',d:'이동속도 +20%',f:a=>a.spd*=1.2},
{n:'연쇄 기도',d:'콤보당 피해 +5%|(최대 10콤보)',f:a=>a.cb+=.05},
{n:'은총의 방패',d:'피격 후 무적|+0.5초',f:a=>a.ih+=.5},
{n:'성수',d:'완벽 패링 시|HP +1',f:a=>a.heal+=1}
];
const BOSSES=[{name:'단 한 번의 악과 수백 가지의 선행',hp:150,rk:'ZAYIN',gift:{id:'thorn',n:'붉은 가시월계관',d:'피격 시 가시 1중첩 (최대 3)|중첩당 패링 피해 +30% · 완벽 패링 시 1중첩 소모',p:.4}},{name:'징벌새',hp:220,rk:'TETH',k:'bird',gift:{id:'beak',n:'부리',d:'콤보 5의 배수 달성 시 HP 1 회복|부리가 쪼아 상처를 아물게 한다 (콤보가 끊기면 다시 쌓임)',p:.4}},{name:'죽은 나비들의 장례',hp:330,rk:'HE',k:'fun',gift:{id:'mourn',n:'엄숙한 애도',d:'완벽 패링 시 애도 1중첩 (최대 3)|3중첩이면 다음 피격 1회를 관이 대신 막아 무효화',p:.4}},{name:'마탄의 사수',hp:340,rk:'HE',k:'frei',gift:{id:'pipe',n:'마탄',d:'완벽 패링 5회마다 마탄 충전 · 5회째 시|막을 수 없는 마탄이 날아가 추가 피해 (완벽 패링 피해 3배)',p:.4}},{name:'큰 새',hp:400,rk:'WAW',k:'bigbird',gift:{id:'lamp',n:'램프',d:'완벽 패링 시 눈이 번짝여|1.2초간 적 탄환 속도 40% 감소',p:.4}},{name:'심판새',hp:380,rk:'WAW',k:'judge',gift:{id:'justitia',n:'유스티티아',d:'받는 피해 25% 감소 (최소 1)|대신 패링 재사용 대기시간 +0.1초',p:.4}},{name:'증오의 여왕',hp:420,rk:'WAW',k:'queen',gift:{id:'hairpin',n:'사랑과 정의의 이름으로',d:'HP가 절반 이하일 때 패링 피해 +30%|(분홍 테두리의 검은 하트 머리핀)',p:.4}},{name:'절망의 기사',hp:410,rk:'WAW',k:'knight',gift:{id:'tear',n:'눈물로 벌려낸 검',d:'피격 시 3초간 패링 피해 +50%|(검정색 물방울 모양)',p:.4}},{name:'탐욕의 왕',hp:440,rk:'WAW',k:'greed'},{name:'아무것도 없는',hp:520,rk:'ALEPH',k:'nothing'}];
let S={st:'title',a:defA(),hp:20,stage:0,combo:0,maxc:0,picks:[],cho:[],B:[],P:[],x:CX,y:BY+BH/2,ehp:1,emax:1,lv:1,boss:BOSSES[0],tm:{},t:0,hs:0,shake:0,fl:0,msg:0,ms:'',inv:0,pt:0,cd:0,rest:0,ok:false,tele:null,naug:0,gifts:[],thorn:0,mourn:0,mag:0,cur:0,off:0,aim:null,tl:[],mc:[],dm:1,fs:{},dark:0,open:0,scope:null,rush:false,newGift:null,pity:0};
function startRun(s){S.a=defA();S.hp=20;S.stage=s||0;S.off=s||0;S.combo=0;S.maxc=0;S.naug=0;S.gifts=[];S.thorn=0;S.mourn=0;S.mag=0;S.pity=0;S.newGift=null;newFight()}
function newFight(){
  const lv=1+Math.floor((S.stage-S.off)/BOSSES.length),b=BOSSES[S.stage%BOSSES.length];
  Object.assign(S,{boss:b,lv,emax:Math.round(b.hp*(1+.35*(lv-1))*(1+.12*S.naug))});S.ehp=S.emax;
  Object.assign(S,{B:[],P:[],tm:{a:1.2,b:3,c:5},dm:1,fs:{},eyes:[],mk:[],vd:null,vf:0,sc:{tilt:0,tgt:0},hist:[],gauge:0,ban:0,gt:0,gm:'',wr:null,ch:null,il:0,ir:0,bm:[],ar:null,af:null,sl:null,kf:[0,0,0],bdm:1,gd:0,wd:null,pe:null,lamp:1,lure:null,exp:0,slow:0,pv:null,tw:0,dk:0,aim:null,tl:[],mc:[],scope:null,dark:0,open:0,rush:false,inv:0,pt:0,cd:0,rest:1.6,tele:null,x:CX,y:BY+BH/2,st:'play'});
}
function parry(){
  if(S.st==='title'||S.st==='over'){S.st='select';S.cur=0;return}
  if(S.st==='select'){startRun(S.cur);return}
  if(S.st!=='play')return;
  if(S.cd<=0&&S.pt<=0&&!(S.ban>0)){noteAct('P');sfx('press');S.pt=S.a.win;S.ok=false;S.cd=.5+(S.gifts.includes('justitia')?.1:0);for(const b of S.B)b.pin=Math.hypot(b.x-S.x,b.y-S.y)<S.a.R+b.r}
}
function pick(i){
  const u=S.cho[i];if(!u)return;
  u.f(S.a,S);S.naug++;sfx('pick');newFight();
}
addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(['Space','KeyZ','KeyJ','Enter'].includes(e.code)&&!e.repeat){parry();e.preventDefault()}
  if(S.st==='pick'&&/^(Digit|Numpad)[1-3]$/.test(e.code))pick(+e.code.slice(-1)-1);
  if(S.st==='select'){const n=BOSSES.length;if(e.code==='ArrowUp')S.cur=(S.cur+n-1)%n;if(e.code==='ArrowDown')S.cur=(S.cur+1)%n;if(/^(Digit|Numpad)[1-9]$/.test(e.code)&&+e.code.slice(-1)<=n)startRun(+e.code.slice(-1)-1)}
  if(e.code.startsWith('Arrow'))e.preventDefault();
  if(e.code==='KeyM'){mute=!mute;mt.textContent=mute?'🔇':'🔊'}
});
const keys={};
addEventListener('keyup',e=>keys[e.code]=0);
document.getElementById('pb').addEventListener('pointerdown',e=>{e.preventDefault();parry()});
const mt=document.getElementById('mt');mt.addEventListener('pointerdown',e=>{e.preventDefault();mute=!mute;mt.textContent=mute?'🔇':'🔊'});
let lp=null;
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect(),k=640/r.width,px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k;
  if(S.st==='select'){const i=Math.floor((py-74)/38);if(py>=74&&i>=0&&i<BOSSES.length)startRun(i);return}
  if(S.st==='pick'){const i=Math.floor((px-25)/205);if(py>150&&py<320&&i>=0&&i<3&&px-25-i*205<190)pick(i);return}
  lp={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);if(S.st!=='play')parry();
});
c.addEventListener('pointermove',e=>{
  if(S.st==='select'){const r=c.getBoundingClientRect(),py=(e.clientY-r.top)*480/r.height,i=Math.floor((py-74)/38);if(py>=74&&i>=0&&i<BOSSES.length)S.cur=i;return}
  if(!lp||S.st!=='play')return;
  const k=640/c.getBoundingClientRect().width;
  const z=S.slow>0?.4:1;S.x+=(e.clientX-lp.x)*k*z;S.y+=(e.clientY-lp.y)*k*z;lp={x:e.clientX,y:e.clientY};clampP();
});
c.addEventListener('pointerup',()=>lp=null);
function clampP(){S.x=Math.max(BX+10+(S.il||0),Math.min(BX+BW-10-(S.ir||0),S.x));S.y=Math.max(BY+10,Math.min(BY+BH-10,S.y))}
function add(x,y,a,v,r,dmg,ex){S.B.push(Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r,dmg,sk:S.boss.k},ex))}
function ring(x,y,col,big){S.P.push({x,y,t:0,col,big});if(col==='#f33')sfx('hit');else if(col==='#ffd23f')sfx('parry');else if(big&&col==='#fff')sfx('perfect')}
let au,mute=false;function bell(){if(mute)return;try{au=au||new AudioContext();au.resume();const o=au.createOscillator(),v=au.createGain(),t=au.currentTime;o.frequency.value=440;o.connect(v);v.connect(au.destination);v.gain.setValueAtTime(.09,t);v.gain.exponentialRampToValueAtTime(.001,t+1);o.start();o.stop(t+1.2)}catch(e){}}
function blk(){if(S.gifts.includes('mourn')&&S.mourn>=3){S.mourn=0;S.msg=.6;S.ms='조문!';return true}return false}
function shot(){
  bell();const A=S.a;
  if(S.pt>0){
    const mu=hp5()*(1+A.cb*Math.min(++S.combo,10))*(1+(S.gifts.includes('thorn')?.3*S.thorn:0));
    S.maxc=Math.max(S.maxc,S.combo);S.ok=true;S.ehp-=A.pdmg*4*mu*S.dm;
    S.cd=0;S.hs=.1;S.shake=.3;S.fl=.12;S.msg=.6;S.ms='PERFECT!';ring(S.x,S.y,'#fff',1);
    S.thorn=Math.max(0,S.thorn-1);if(S.gifts.includes('mourn'))S.mourn=Math.min(3,S.mourn+1);if(S.gifts.includes('pipe')&&++S.mag>=5){S.mag=0;S.ehp-=A.pdmg*3*S.dm;S.mg=.8;ring(S.x,S.y,'#4aa3ff',1)}if(S.gifts.includes('lamp'))S.tw=1.2;S.hp=Math.min(A.mhp,S.hp+A.heal);
  }else if(S.inv<=0){
    if(!blk())S.hp-=dmgOf(6);S.inv=A.ih;S.combo=0;S.shake=.25;ring(S.x,S.y,'#f33');
    if(S.gifts.includes('thorn'))S.thorn=Math.min(3,S.thorn+1);
  }
}
function patFun(dt){
  const F=S.fs,r=S.ehp/S.emax,m=1+.12*(S.lv-1),rnd=Math.random;
  if(F.ph===undefined)Object.assign(F,{ph:0,t:0,n:0,g:0,s:.5,o:0,d:0});
  S.rush=false;
  if(r<=.4){F.g+=dt;S.open=F.g%11>5?1:0}
  const k=S.open?1.4:1;S.dm=S.open?.5:1;
  if(S.open){F.o-=dt;if(F.o<=0){F.o=.35;add(BX+20+rnd()*(BW-40),CY,0,0,7,3,{bf:1,ev:.9,tt:.01,sp:90*m,jit:(rnd()-.5)*.8,life:6})}}
  F.t+=dt;if(F.ph!==1)S.dark=Math.max(0,S.dark-dt*2);
  F.fl=(F.fl||0)-dt;if(F.fl<=0){F.fl=1.4/k;const s=rnd()<.5?-1:1;add(s<0?BX-14:BX+BW+14,BY+20+rnd()*(BH-40),0,0,7,3,{bf:1,ev:.9,tt:.01,sp:75*m,jit:(rnd()-.5)*.6,life:8})}
  if(F.ph===0){
    F.s-=dt;
    if(F.s<=0){F.s=2.3/k;for(const s of[-1,1]){const y=BY+20+rnd()*(BH-40);for(let i=0;i<4;i++)add(s<0?BX-14:BX+BW+14,y,0,0,7,3,{bf:1,ev:.8,tt:.01+i*.22,sp:115*m*k,jit:0,life:6})}}
    if(F.t>6.5){F.ph=1;F.t=0;F.n=0}
  }else if(F.ph===1){
    S.dark=Math.min(1,S.dark+dt*2);
    if(!S.scope){if(F.n>=(S.open?5:4)){F.ph=2;F.t=0;F.d=0}else{const iv=Math.max(.9,2.2-.35*F.n)/k;S.scope={t:iv,tot:iv}}}
    else{S.scope.t-=dt;if(S.scope.t<=0){shot();S.scope=null;F.n++}}
  }else{
    if(!F.d){F.d=1;for(let i=0;i<14;i++)add(0,0,0,0,7,3,{bf:1,fl:1,ft:0,cx:BX+30+rnd()*(BW-60),cy:BY+30+rnd()*(BH-60),ax:15+rnd()*35,ay:15+rnd()*35,w:1+rnd(),ph:rnd()*6,sp:140+rnd()*80,jit:(rnd()-.5)*.9,life:9})}
    if(F.t>3.2&&F.d===1){F.d=2;S.rush=true}
    if(F.t>6.2){F.ph=0;F.t=0;F.s=.5}
  }
}
function sched(F,ev,end){F.ev=ev;F.end=end;F.t=0}
function magic(F,k){
  const E=BX+BW,Bt=BY+BH,mid=BX+BW/2,H=Math.PI,Lr=n=>Array.from({length:n},(_,i)=>BY+(i+1)*BH/(n+1)),Uc=n=>Array.from({length:n},(_,i)=>BX+(i+1)*BW/(n+1));
  const G=(t,l)=>[t,()=>{for(const [x,y,a,big,self] of(typeof l==='function'?l():l))S.mc.push({x,y,a,big,self,t:1.4,tot:1.4})}];
  const sets={
    1:[G(0,()=>[[BX-14,S.y,0]])],
    2:[G(0,[[BX-14,BY+40,0],[E+14,Bt-40,H]])],
    3:[G(0,Uc(3).map(x=>[x,Bt+14,-H/2]))],
    4:[G(0,Lr(3).map(y=>[BX-14,y,0]))],
    5:[G(0,[[mid,Bt+14,-H/2,1],...[BX+25,BX+75,BX+225,BX+275].map(x=>[x,Bt+14,-H/2])])],
    6:[G(0,Lr(3).map(y=>[E+14,y,H])),G(1.6,Lr(3).map(y=>[BX-14,y,0])),G(3.2,()=>[[CX,BY-14,Math.atan2(S.y-BY+14,S.x-CX)]])],
    7:[G(0,[[mid,Bt+14,-H/2,1,1]])]
  };
  for(const [t,f] of sets[k]||[])F.me.push([F.clk+t,f]);
}
function patFrei(dt){
  const F=S.fs,m=1+.12*(S.lv-1),rnd=Math.random,k=F.k||0;
  if(F.ph===undefined){F.ph=-1;F.k=0;F.t=0;F.ev=[];F.end=0;F.me=[];F.clk=0;F.next=5}
  const A=S.aim;
  if(A){A.t-=dt;if(A.t>A.lock){A.x=S.x;A.y=S.y}if(A.t<=0){add(CX,CY,Math.atan2(A.y-CY,A.x-CX),520*m,8,5);S.aim=null}}
  for(const o of S.tl){o.t-=dt;if(o.t<=0){o.fn();o.dead=1}}S.tl=S.tl.filter(o=>!o.dead);
  for(const o of S.mc){o.t-=dt;if(o.t<=0&&!o.f){add(o.x,o.y,o.a,(o.self?420:o.big?440:560)*m,o.big?34:14,o.big?10:7,o.self?{np:1,self:1}:{np:1});o.f=1}if(o.t<-.4)o.dead=1}S.mc=S.mc.filter(o=>!o.dead);
  F.t+=dt;
  F.clk+=dt;F.me=F.me.filter(e=>{if(e[0]<=F.clk){e[1]();return false}return true});
  if(F.clk>=F.next&&F.k<7){magic(F,++F.k);F.next=F.k>=7?1e9:F.clk+(F.k===6?7.5:6)}
  F.am=(F.am||1)-dt;if(F.am<=0){F.am=Math.max(.3,1.3-.17*k);add(CX,CY,Math.PI/2+(rnd()-.5)*1.6,(110+rnd()*90)*m,5,3)}
  while(F.ev.length&&F.ev[0][0]<=F.t)F.ev.shift()[1]();
  if(F.t<F.end||F.ev.length)return;
  const pc=()=>{const h=rnd()<.5,rv=rnd()<.5,p=h?BY+15+rnd()*(BH-30):BX+15+rnd()*(BW-30);
    const [x1,y1,x2,y2]=h?(rv?[BX+BW+14,p,BX-14,p]:[BX-14,p,BX+BW+14,p]):(rv?[p,BY+BH+14,p,BY-14]:[p,BY-14,p,BY+BH+14]);
    S.tl.push({x1,y1,x2,y2,t:.8,tot:.8,fn:()=>add(x1,y1,Math.atan2(y2-y1,x2-x1),420*m,10,6,{np:1})})};
  const ph=F.ph=(F.ph+1)%3;
  if(ph===0){const n=1+(k>=2)+(k>=4)+(k>=6);sched(F,Array.from({length:n},(_,i)=>[i*1.3,()=>{S.aim={t:1.1,tot:1.1,lock:.35,x:S.x,y:S.y}}]),n*1.3+.1)}
  else if(ph===1){const n=6+k*2;sched(F,Array.from({length:n},(_,i)=>[i*.3,()=>add(CX,CY,Math.atan2(S.y-CY,S.x-CX)+(rnd()-.5)*.9,(150+rnd()*130)*m,6,4,i===n-1?{last:1,r:9}:{})]),n*.3+.4)}
  else if(ph===2){const n=Math.min(5,2+(k>>1));sched(F,Array.from({length:n},(_,i)=>[i*.9,pc]),n*.9+.3)}
  
}
function gun(o,p){
  const s=o.big?1.6:1,k=o.f?Math.max(0,1+o.t/.35):0,sl=1-Math.min(1,p*2.5);
  g.save();g.translate(o.x,o.y);g.rotate(o.a);g.scale(s,s);g.globalAlpha=o.f?Math.max(0,1+o.t/.4):1;
  g.translate(-sl*50-k*16,o.f?0:Math.sin(S.t*45)*.8*p);g.lineJoin='round';
  g.fillStyle='#2a2a33';g.strokeStyle='#888';g.lineWidth=1.5;g.fillRect(-72,-3,74,6);g.strokeRect(-72,-3,74,6);
  g.fillStyle='#1f3a93';g.strokeStyle='#e6c229';g.beginPath();g.moveTo(-72,-4);g.lineTo(-94,-8);g.lineTo(-106,3);g.lineTo(-95,11);g.lineTo(-72,5);g.closePath();g.fill();g.stroke();
  g.beginPath();g.moveTo(-60,-3);g.lineTo(-60,3);g.moveTo(-46,-3);g.lineTo(-46,3);g.stroke();
  g.restore();
  if(k>.3){g.save();g.translate(o.x,o.y);g.rotate(o.a);g.shadowColor='#8cf';g.shadowBlur=20;g.fillStyle='#fff';g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,r=(i%2?8:(o.big?44:28))*k;g.lineTo(Math.cos(a)*r+10,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}
}
function retort(force){
  const r=S.ehp/S.emax,m=1+.12*(S.lv-1);

    txt('STAGE '+(S.stage-S.off)+' 클리어 · HP 6 회복',320,110,16,'#ffd23f');txt('증강을 선택하세요',320,138,14,'#ccc');
    if(S.newGift){g.strokeStyle='#c0392b';g.lineWidth=3;g.strokeRect(25,340,590,100);({mourn:coffin,pipe:pipe,beak:beak,lamp:eyesIcon,justitia:cloth,hairpin:hpIcon,tear:tearIcon}[S.newGift.id]||crown)(75,392,1.5);txt('EGO 기프트 획득!',135,366,14,'#ff6b6b','left');txt(S.newGift.n,135,392,18,'#fff','left');S.newGift.d.split('|').forEach((l,j)=>txt(l,135,414+j*18,13,'#ccc','left'))}
    S.cho.forEach((u,i)=>{
      const x=25+i*205;g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(x,150,190,170);
      txt((i+1)+'',x+95,180,14,'#888');txt(u.n,x+95,214,18,'#ffd23f');
      u.d.split('|').forEach((l,j)=>txt(l,x+95,254+j*24,14));
    });
  }
}
let last=performance.now();
let errT=0,errM='';
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
  try{update(dt)}catch(e){errT=6;errM='update: '+e.message;console.error(e)}
  try{draw()}catch(e){errT=6;errM='draw: '+e.message;console.error(e);c.width=640;g.imageSmoothingEnabled=false}
  if(errT>0){errT-=dt;g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,640,16);g.font='10px monospace';g.textAlign='left';g.fillStyle='#f66';g.fillText(errM.slice(0,110),4,11)}
  requestAnimationFrame(loop)})(last);
</script>
